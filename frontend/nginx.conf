server {
    listen 80;

    # Sicherheits-Header fuer alle Antworten (auch Fehlerseiten: "always").
    # CSP: Skripte, Styles, Bilder und Verbindungen (API, WebSocket) nur von dieser Adresse;
    # 'unsafe-inline' bei style-src fuer die Inline-Styles der Diagramme.
    # HSTS wirkt nur ueber HTTPS (z. B. ueber Cloudflare/Caddy), per HTTP ignoriert der Browser es.
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
